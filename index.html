<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rock Paper Scissors Game</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <h1>Rock Paper Scissors Game</h1>

  <div class="choices">
    <button class="choice" id="rock">
      <img src="rock.jpg" alt="Rock" />
    </button>
    <button class="choice" id="paper">
      <img src="paper.jpg" alt="Paper" />
    </button>
    <button class="choice" id="scissors">
      <img src="scissors.jpg" alt="Scissors" />
    </button>
  </div>

  <div class="score-board">
    <div class="score">
      <p id="user-score">0</p>
      <p>You</p>
    </div>
    <div class="score">
      <p id="comp-score">0</p>
      <p>Computer</p>
    </div>
    <div class="score">
      <p id="draw-score">0</p>
      <p>Draw</p>
    </div>
  </div>

  <div class="msg-container">
    <p id="msg">Make your move!</p>
    <button id="reset-btn">Reset Scores</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
